<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

<body class="body_sign">
    <main class="main_sign">
        <img src="./assets/landing.png"class="landing">
        </main>
     <div class="header_sign">
   <header class="w-full max-w-[1000px] mx-auto">
        
        <div class="flex  justify-around  items-center p-5">
          <h1  class="logo">SERIES<span class="hub">HUB</span>  <img src="./assets/logoproject.png"class="w-15"></h1>
            
            <a href="./index.html" class="home">HOME</a>
            <a href="./signin.html" class="signin active">SIGN IN</a>
            <a href="./discover.html" class="discover">EXPLORE</a>
            <a href="./profile.html" class="profile"><i class="fa-regular fa-circle-user mr-2 text-lg items-center"></i>PROFILE</a>
            
        </div>
     

    </header>
      
    </div>


<div class="signup_box"> 
    
    <form  id="signupForm" method="get" class="mt-15 pl-30  ">
        <label for="name" class="signin_label">Enter your Name</label><br>
        <input type="text" id="name" name="user_name" class="signin_input" placeholder="Eg:Abraham John" required><br>

        <label for="genre" class="signin_label">Favourite Generes<span class="p-5 text-[13px] text-red-400">(Use ctrl + select for multiple selection)</span></label><br>
        
        <select name="genre" id="genre" multiple size="4" class=" select_genre">
           
            <option value="Comedy">Comedy</option>
            <option value="Family">Family</option>
             <option value="Drama">Drama</option>
            <option value="Horror">Horror</option>
             <option value="Romance">Romance</option>
            <option value="Crime">Crime</option>
            <option value="Adventure">Adventure</option>
             <option value="Scienece-Fiction">Scienece-Fiction</option>
            <option value="Thriller">Thriller</option>
             <option value="Sports">Sports</option>
            <option value="Fantasy">Fantasy</option>
        </select><br>
        

        <label for="email"  class="signin_label">Enter your Email address</label><br>
        <input type="email" id="email" class="signin_input" name="email" placeholder="Eg:user12@gmail.com " required><br>

        <label for="pass"  class="signin_label">Create a Password</label><br>
        <input type="password" id="password" class="signin_input" name="pass" placeholder="Eg:abcd*123" required><br>

        <label for="cnfirm" class="signin_label">Confirm Password</label><br>
        <input type="password" id="cnfpassword" class="signin_input" name="cnfirm" required><br>

        <button type="submit" id="signup_submit"  >Submit and Login</button>
    </form>

</div> 
     




<script src="./signup.js"></script>
</body>
</html>
