     </div>

     <main class="main_home flex-1">
        <img src="./assets/home.png" class="home_img ">
        

        <div class="w-full max-w-[1200px] mx-auto home_page " id="gfs">
            <img src="./assets/cover.png" class="w-350 mt-10 hidden sm:block">
          <div class="gst">
          <div class="genre">

            <label for="genre">Genre :</label>
            <select id="genres" class="bg_select">
                <option value="all">All</option>
                <option value="action">Action</option>
                <option value="adventure">Adventure</option>
                <option value="comedy">Comedy</option>
                <option value="crime">Crime</option>
                <option value="drama">Drama</option>
                 <option value="family">Family</option>
                 <option value="fantasy">Fantasy</option>
                <option value="horror">Horror</option>
                <option value="romance">Romance</option>
                <option value="sports">Sports</option>
                <option value="science-fiction">Science-Fiction</option>
                <option value="thriller">Thriller</option>
            </select>

          </div>


          <div class="filter">

            <label for="filter">Sort By :</label>
            <select id="sorting"  class="bg_select">
              <option value="none">None</option>
              <option value="rating-higher">Highest Rating</option>
              <option value="rating-lower">Lowest Rating</option>
              <option value="latest">Latest </option>
              <option value="oldest"> Oldest</option>
            </select>


          </div>

          <div class="type">

            <label for="type">Type :</label>

            <select id="type" class="bg_select">
              <option value="all">All</option>
              <option value="Scripted">Scripted</option>
              <option value="Animation">Animated</option>
               <option value="Reality">Reality</option>
               <option value="Documentary">Documentry</option>

            </select>

          </div>

          </div>



            <div id="mv" class="home_mv grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 px-4">

            </div>

         

        </div>

        <div id="details" class="w-full max-w-[1200px] mx-auto mb-20">
          
          
        </div>
       
        <button id="backToTop"><i class="fa-solid fa-arrow-up"></i></button>
